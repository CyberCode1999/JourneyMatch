<!doctype html>
<html lang="en">
  <!-- Head section: page metadata, page title, and linked stylesheets -->
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>JourneyMatch - Result</title>
    <link
      rel="stylesheet"
      href="style.css" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />
  </head>

  <!-- Body section: everything visible on the results page -->
  <body>
    <!-- Header bar: logo/title and slogan at the top of the page -->
    <div class="container-fluid text-left">
      <a
        class="title"
        href="index.html"
        ><h1>JourneyMatch</h1></a
      >
      <p id="Slogen">Find your Ideal Destination</p>
    </div>

    <!-- Main content area: result title and destination recommendation section -->
    <div class="container text-center">
      <h2 id="ideal-destinations">Your Ideal Destinations</h2>
      <p id="based-on">
        Based on your preferences, here are three destinations that match your
        criteria:
      </p>

      <!-- Recommendation carousel: displays destination slides, navigation arrows, and dots -->
      <div class="row result-row">
        <div class="col-md-8 col-md-offset-2">
          <div id="carousel">
            <span id="counter"></span>
            <div id="slides">
              <div class="slide active">
                <p class="message">Loading your recommendations...</p>
              </div>
            </div>
            <!-- Previous slide button -->
            <button
              id="prevBtn"
              class="nav-arrow"
              type="button"
              aria-label="Previous">
              &#8249;
            </button>
            <!-- Next slide button -->
            <button
              id="nextBtn"
              class="nav-arrow"
              type="button"
              aria-label="Next">
              &#8250;
            </button>
            <!-- Dot navigation for each destination -->
            <ul id="dots"></ul>
          </div>
          <!-- Hint text below the carousel -->
          <p
            class="text-muted"
            style="margin-top: 8px; font-size: 12px">
            Use the arrows, the dots, or your keyboard's left/right keys.
          </p>
        </div>
      </div>

      <!-- Action buttons: return to the quiz or home page -->
      <div class="result-actions">
        <a
          href="question.html"
          class="btn btn-primary"
          id="back-to-question"
          >Take the Quiz Again</a
        >
        <a
          href="index.html"
          class="btn btn-default"
          id="back-to-home"
          >Back to Home</a
        >
      </div>
    </div>

    <!-- Script section: handles recommendation payload loading and carousel behavior -->
    <script>
      (function () {
        // DOM references for the carousel and controls
        var slidesBox = document.getElementById("slides");
        var dotsBox = document.getElementById("dots");
        var prevBtn = document.getElementById("prevBtn");
        var nextBtn = document.getElementById("nextBtn");
        var counter = document.getElementById("counter");
        var hint = document.querySelector(".text-muted");
        var current = 0;
        var lastError = "";

        // UTF-8 safe base64url decoding
        function fromBase64Url(str) {
          var b64 = str.replace(/-/g, "+").replace(/_/g, "/");
          while (b64.length % 4) {
            b64 += "=";
          }
          var binary = atob(b64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new TextDecoder().decode(bytes);
        }

        // Load recommendation data from the URL hash or browser storage
        function loadPayload() {
          var hash = window.location.hash ? window.location.hash.slice(1) : "";

          if (hash) {
            var attempts = [];
            if (hash.indexOf("b64.") === 0) {
              attempts.push(function () {
                return fromBase64Url(hash.slice(4));
              });
            }
            attempts.push(function () {
              return fromBase64Url(hash);
            });
            attempts.push(function () {
              return decodeURIComponent(hash);
            });
            attempts.push(function () {
              return hash;
            });

            for (var a = 0; a < attempts.length; a++) {
              try {
                var parsed = JSON.parse(attempts[a]());
                if (parsed && typeof parsed === "object") return parsed;
              } catch (e) {
                lastError = e.name + ": " + e.message;
              }
            }
            console.warn("Could not decode URL hash. Last error:", lastError);
          }

          var stores = [];
          try {
            stores.push(sessionStorage.getItem("journeyPayload"));
          } catch (e) {}
          try {
            stores.push(localStorage.getItem("journeyPayload"));
          } catch (e) {}
          for (var i = 0; i < stores.length; i++) {
            if (stores[i]) {
              try {
                return JSON.parse(stores[i]);
              } catch (e) {}
            }
          }

          // Legacy keys from the earlier version
          try {
            var legacy = localStorage.getItem("journeyResult");
            if (legacy) {
              var legacyDest = [];
              try {
                legacyDest = JSON.parse(
                  localStorage.getItem("journeyDestinations") || "[]",
                );
              } catch (e) {}
              return {
                question: localStorage.getItem("journeyQuestion") || "",
                destinations: legacyDest,
                raw: legacy,
              };
            }
          } catch (e) {}

          return null;
        }

        // Convert plain text responses into destination slide objects if needed
        function slicePlainText(text) {
          return text
            .split(/\n\s*\n/)
            .map(function (c) {
              return c.trim();
            })
            .filter(Boolean)
            .map(function (chunk) {
              var lines = chunk.split("\n");
              return {
                name: lines[0].replace(/^[\s*#\-\d.)]+/, "").trim(),
                country: "",
                description: lines.slice(1).join("\n").trim() || chunk,
                why: "",
              };
            });
        }

        // Create an HTML element with optional class and text content
        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text) node.textContent = text;
          return node;
        }

        // Hide the carousel controls when there are no slides to navigate
        function hideControls() {
          prevBtn.style.display = "none";
          nextBtn.style.display = "none";
          dotsBox.style.display = "none";
          counter.style.display = "none";
          if (hint) hint.style.display = "none";
        }

        // Display a message inside the slide area when no valid results are found
        function showMessage(msg) {
          slidesBox.innerHTML = "";
          var slide = el("div", "slide active");
          slide.appendChild(el("p", "message", msg));
          slidesBox.appendChild(slide);
          hideControls();
        }

        // Switch the active slide and update the pagination indicator
        function goTo(index) {
          var slides = slidesBox.querySelectorAll(".slide");
          var dots = dotsBox.querySelectorAll("li");
          if (!slides.length) return;
          current = (index + slides.length) % slides.length;
          for (var i = 0; i < slides.length; i++) {
            slides[i].classList.toggle("active", i === current);
            if (dots[i]) dots[i].classList.toggle("active", i === current);
          }
          counter.textContent = current + 1 + " / " + slides.length;
        }

        // Render the destination results and attach navigation events
        var payload = loadPayload();

        if (!payload) {
          var msg =
            "No recommendations found. Please submit your request from the question page.";
          if (window.location.hash) {
            msg =
              "Data arrived in the URL but could not be read.\n\n" +
              (lastError || "Unknown decoding error") +
              "\n\nHash starts with: " +
              window.location.hash.slice(1, 60) +
              "...";
          }
          showMessage(msg);
          return;
        }

        var destinations = Array.isArray(payload.destinations)
          ? payload.destinations
          : [];
        if (!destinations.length && payload.raw && payload.raw.trim()) {
          destinations = slicePlainText(payload.raw);
        }

        if (!destinations.length) {
          showMessage(
            "The server replied but no destinations could be read from the response.",
          );
          return;
        }

        if (payload.question) {
          document.getElementById("based-on").textContent =
            'Based on your words: "' + payload.question + '"';
        }

        slidesBox.innerHTML = "";
        dotsBox.innerHTML = "";

        destinations.forEach(function (dest, i) {
          var slide = el("div", "slide" + (i === 0 ? " active" : ""));
          slide.appendChild(el("div", "rank", String(i + 1)));
          slide.appendChild(
            el("h3", null, dest.name || "Destination " + (i + 1)),
          );
          if (dest.country) slide.appendChild(el("p", "country", dest.country));
          slide.appendChild(el("p", "description", dest.description || ""));
          if (dest.why) slide.appendChild(el("p", "why", dest.why));
          slidesBox.appendChild(slide);

          var dot = el("li", i === 0 ? "active" : null);
          dot.addEventListener("click", function () {
            goTo(i);
          });
          dotsBox.appendChild(dot);
        });

        prevBtn.addEventListener("click", function () {
          goTo(current - 1);
        });
        nextBtn.addEventListener("click", function () {
          goTo(current + 1);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "ArrowLeft") goTo(current - 1);
          if (e.key === "ArrowRight") goTo(current + 1);
        });

        if (destinations.length < 2) {
          hideControls();
        } else {
          counter.textContent = "1 / " + destinations.length;
        }
      })();
    </script>
  </body>
</html>
